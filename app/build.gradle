plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.nhp.app'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.nhp.app'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The debug harness is validated by hand on device; lint must not gate CI.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':protocol')
}
